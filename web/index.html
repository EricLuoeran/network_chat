<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Chat - 局域网聊天</title>
<link rel="icon" type="image/x-icon" href="/web/favicon.ico">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="my-info">
        <div class="avatar" id="my-avatar"></div>
        <div>
          <div id="my-name" style="cursor:pointer;" title="点击改名">...</div>
          <div id="my-fingerprint" class="fingerprint">...</div>
        </div>
      </div>
    </div>

    <div id="peer-search">
      <input type="text" id="search-input" placeholder="搜索联系人..." />
    </div>

    <div id="peer-list"></div>
    <div id="device-list-section" style="border-top:1px solid #eee;">
      <div style="padding:8px 16px;font-size:11px;color:#999;display:flex;align-items:center;gap:8px;">
        📱 本机设备
        <button id="btn-qr" title="显示二维码" style="border:none;background:none;cursor:pointer;font-size:14px;">📷</button>
      </div>
      <div id="device-list"></div>
    </div>

    <div id="sidebar-footer">
      <div id="my-address" style="font-size:11px;color:#999;margin-bottom:6px;"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="btn-manual-connect" title="手动连接" style="flex:1;font-size:12px;padding:4px;">➕ 手动连接</button>
        <button id="btn-refresh" title="刷新">🔄</button>
        <span id="status-text">等待连接...</span>
      </div>
    </div>

    <!-- QR code modal -->
    <div id="qr-modal" class="modal-overlay" style="display:none;">
      <div class="modal" style="text-align:center;">
        <h3>📱 手机扫码连接</h3>
        <p style="font-size:13px;">手机连同一WiFi，扫码即可互传文件</p>
        <img id="qr-img" src="/qr.png" style="width:256px;height:256px;" alt="QR" />
        <p style="font-size:12px;color:#999;margin-top:8px;" id="qr-url"></p>
        <button onclick="document.getElementById('qr-modal').style.display='none'" class="btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <!-- Main chat area -->
  <div id="main">
    <div id="chat-header">
      <div id="chat-peer-name">选择一个联系人开始聊天</div>
      <div id="chat-peer-status"></div>
    </div>

    <div id="chat-empty" class="chat-empty-show">
      <div class="empty-icon">💬</div>
      <div class="empty-title">Network Chat</div>
      <div class="empty-subtitle">局域网内自动发现，端到端加密通信</div>
      <div class="empty-info">
        同一网络下的同事会自动出现在左侧列表<br>
        点击联系人即可开始聊天
      </div>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area">
      <div id="file-preview"></div>
      <div id="input-row">
        <button id="btn-file" title="发送文件">📎</button>
        <button id="btn-folder" title="发送文件夹">📁</button>
        <input type="text" id="msg-input" placeholder="输入消息..." autofocus />
        <button id="btn-send" title="发送">▶</button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="file-input" style="display:none" multiple />
<input type="file" id="folder-input" style="display:none" webkitdirectory directory multiple />

<script src="/web/app.js"></script>
</body>
</html>
